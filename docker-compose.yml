version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vbb-smartdelay-db
    environment:
      POSTGRES_DB: smartdelay
      POSTGRES_USER: smartdelay
      POSTGRES_PASSWORD: smartdelay_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdelay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
